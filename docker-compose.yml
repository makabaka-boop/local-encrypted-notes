services:
  # 一次性验收服务：类型检查 -> 单元测试 -> 生产构建，结束后容器自动删除
  verify:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "verify"]
    restart: "no"

  # 可选：本地启动后访问 http://localhost:8080
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
